[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minisiem"
version = "0.1.0"
description = "A small, readable SIEM for learning detection engineering: log parsers, Sigma-style rules, correlation, dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/HossamAlzohbi/mini-siem"
Issues = "https://github.com/HossamAlzohbi/mini-siem/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minisiem = "minisiem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minisiem = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
